<!doctype html>
<html lang="en" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nona Shion · Aesthetic Fashion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Jost:wght@300;400;500&amp;display=swap">
<style>
:root{--bg:#f7f5f3;--hero:#efeae4;--ink:#2b2b2e;--gold:#9a8468;--card:#fff;--line:#d9cfc2;--muted:#6b665f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1c1b;--hero:#292725;--ink:#f1ece6;--gold:#c2ab8a;--card:#262422;--line:#4a443d;--muted:#aaa299}}
:root[data-theme="dark"]{--bg:#1d1c1b;--hero:#292725;--ink:#f1ece6;--gold:#c2ab8a;--card:#262422;--line:#4a443d;--muted:#aaa299}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.6 Jost,system-ui,sans-serif}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 5vw}
.brand{font:400 22px "Cormorant Garamond",Georgia,serif;letter-spacing:.2em;text-decoration:none;color:var(--ink)}
nav a{margin-left:22px;text-decoration:none;color:var(--ink);font-size:14px;letter-spacing:.08em}
nav a.on{border-bottom:1px solid var(--gold)}
.eyebrow{font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);font-weight:500}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;margin:.1em 0;line-height:1.05}
h1{font-size:clamp(44px,8vw,92px)} h2{font-size:clamp(34px,5vw,56px)}
em{color:var(--gold)}
.hero{margin:0 5vw;background:var(--hero);border-radius:36px;padding:7vw 5vw;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero p{max-width:470px}
.btn{display:inline-block;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:16px 30px;font:500 15px Jost,sans-serif;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:9px 16px;font-size:13px}
.pills{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 18px;font-size:14px;color:var(--ink);text-decoration:none}
.logo{position:relative;background:var(--card);border-radius:30px;aspect-ratio:1.5;display:grid;place-items:center;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.08)}
.logo b{font:500 clamp(26px,3.6vw,46px) "Cormorant Garamond",serif;letter-spacing:.04em;display:block}
.logo span{font-size:11px;letter-spacing:.35em;color:var(--gold)}
.tag{position:absolute;background:#2b2b2e;color:#f1ece6;border-radius:18px;padding:12px 20px;font-size:13px}
.tag b{display:block;font:400 22px "Cormorant Garamond",serif;color:#d9c9ad}
section{padding:70px 5vw}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px}
.card{background:var(--card);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--hero);display:block}
.card .b{padding:18px 20px 22px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font:500 24px "Cormorant Garamond",serif}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.price{color:var(--gold);font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.form{max-width:640px;background:var(--card);border:1px dashed var(--line);border-radius:26px;padding:26px;margin-bottom:40px;display:grid;gap:12px}
.form input,.form textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font:300 15px Jost,sans-serif}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.msg{font-size:14px;color:var(--gold)}
.empty{color:var(--muted);padding:30px 0}
.own{font-size:12px;letter-spacing:.2em;color:var(--gold);margin-left:20px}
@media(max-width:800px){.hero{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
html,body{max-width:100%;overflow-x:hidden}
img{max-width:100%}
header{gap:10px 16px;flex-wrap:wrap}
.brand{white-space:nowrap}
nav{display:flex;align-items:center;white-space:nowrap}
.hero>div{min-width:0}
.logo{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:auto;min-height:260px;padding:48px 24px}
.t1{top:-20px;right:-14px}.t2{bottom:-24px;left:-24px}
@media(min-width:801px) and (max-width:1100px){.hero{gap:24px;padding:48px 36px}.logo b{font-size:30px}}
@media(max-width:800px){
 header{padding:16px 5vw}
 .brand{font-size:18px;letter-spacing:.14em}
 nav a{margin-left:14px;font-size:13px}
 .own{margin-left:12px}
 .hero{padding:32px 22px 44px;border-radius:28px;gap:36px}
 h1{font-size:clamp(40px,12vw,64px)}
 .logo{min-height:200px;padding:44px 16px}
 .tag{padding:8px 14px;font-size:12px;border-radius:14px}
 .tag b{font-size:18px}
 .t1{top:-18px;right:10px}.t2{bottom:-18px;left:10px}
 section{padding:48px 5vw}
 .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
}
@media(max-width:420px){.grid{grid-template-columns:1fr}.pills{gap:8px}.pill{padding:8px 14px}.btn{padding:14px 26px}}
header,main{max-width:1200px;margin-left:auto;margin-right:auto}
header{padding:20px 24px}
.hero{margin:0 24px;padding:clamp(28px,5vw,56px);border-radius:32px;gap:clamp(24px,4vw,48px)}
section{padding:56px 24px}
h1{font-size:clamp(40px,7vw,72px)}
h2{font-size:clamp(32px,4.5vw,48px)}
.logo{min-height:220px;padding:44px 20px}
.logo b{font-size:clamp(26px,4vw,40px)}
.t1{top:-16px;right:12px}.t2{bottom:-16px;left:12px}
.tag{padding:10px 16px;font-size:12px;border-radius:16px}.tag b{font-size:19px}
.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>

<script>
(function(){
var DATA=JSON.parse(document.getElementById('data').textContent);
DATA.socials=DATA.socials||{};var socEdit=false,pendDel=null;var app=document.getElementById('app'),owner=false,art=null,assets=null,editing=null,formOpen=false,busy=false,note='';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safe(u){return /^https?:\/\//i.test(u||'')?u:'#'}
function sorted(){return DATA.products.slice().sort(function(a,b){return b.ts-a.ts})}
function card(p){
 return '<article class="card"><img src="'+esc(p.img)+'" alt="'+esc(p.title)+'" loading="lazy"><div class="b"><h3>'+esc(p.title)+'</h3><span class="price">'+esc(p.price)+'</span><p>'+esc(p.desc)+'</p>'+
 '<div class="row"><a class="btn sm" href="'+esc(safe(p.link))+'" target="_blank" rel="noopener sponsored">Shop Now</a>'+
 (owner?'<button class="btn sm ghost" data-edit="'+p.id+'">Edit</button><button class="btn sm ghost" data-del="'+p.id+'">'+(pendDel===p.id?'Confirm delete':'Delete')+'</button>':'')+'</div></div></article>'}
function pills(){
 var n=[['instagram','Instagram'],['tiktok','TikTok'],['pinterest','Pinterest']],h='<div class="pills">';
 n.forEach(function(x){var u=DATA.socials[x[0]];if(u)h+='<a class="pill" href="'+esc(safe(u))+'" target="_blank" rel="noopener">'+x[1]+'</a>'});
 if(owner)h+='<button class="pill" id="soc" style="cursor:pointer;font:inherit">'+(socEdit?'Cancel':'Edit social links')+'</button>';
 h+='</div>';
 if(owner&&socEdit)h+='<div class="form" style="margin:16px 0 0"><input id="s_instagram" placeholder="Instagram link (https://…)" value="'+esc(DATA.socials.instagram)+'"><input id="s_tiktok" placeholder="TikTok link (https://…)" value="'+esc(DATA.socials.tiktok)+'"><input id="s_pinterest" placeholder="Pinterest link (https://…)" value="'+esc(DATA.socials.pinterest)+'"><button class="btn" id="ss">Save links</button><div class="msg" id="sm"></div></div>';
 return h}
function home(){
 var l=sorted().slice(0,3);
 return '<div class="hero"><div><div class="eyebrow">Aesthetic Fashion</div><h1>Wear it <em style="font-style:italic">effortlessly.</em></h1><p>Curated fashion finds and outfit inspiration centered on sweatshirts and hoodies. Shop top picks and wear them effortlessly.</p><p><a class="btn" href="#blog">Blog</a></p>'+
 pills()+'</div>'+
 '<div class="logo"><div><b>NONA SHION</b><span>AESTHETIC FASHION</span></div><div class="tag t1"><b>Hoodies</b>&amp; sweatshirts</div><div class="tag t2"><b>Curated</b>outfit inspo</div></div></div>'+
 '<section><div class="head"><div><div class="eyebrow">Fresh finds</div><h2>Latest posts</h2></div><a class="btn ghost" href="#blog">Explore More</a></div>'+
 (l.length?'<div class="grid">'+l.map(card).join('')+'</div>':'<div class="empty">New finds are coming soon.</div>')+'</section>'}
function form(){
 var p=editing?DATA.products.filter(function(x){return x.id===editing})[0]:null;p=p||{};
 return '<div class="form" id="f"><div>'+(editing?'Edit find':'Add a new find')+'</div><input type="file" id="fi" accept="image/*">'+
 '<input id="ft" placeholder="Title" value="'+esc(p.title)+'"><textarea id="fd" rows="3" placeholder="Description">'+esc(p.desc)+'</textarea>'+
 '<div class="two"><input id="fp" placeholder="Cost (e.g. ₱899)" value="'+esc(p.price)+'"><input id="fl" placeholder="Shop link (https://…)" value="'+esc(p.link)+'"></div>'+
 '<button class="btn" id="fs">'+(editing?'Save changes':'Publish post')+'</button><div class="msg" id="fm">'+esc(note)+'</div></div>'}
function blog(){
 var l=sorted();
 return '<section><div class="eyebrow">The Blog</div><h2>Top picks &amp; finds</h2><div style="height:30px"></div>'+
 (owner?(formOpen?form():'<p><button class="btn" id="add">Add a New Find</button></p><div class="msg">'+esc(note)+'</div>'):'')+
 (l.length?'<div class="grid">'+l.map(card).join('')+'</div>':'<div class="empty">No finds published yet.</div>')+'</section>'}
function render(){
 var b=location.hash==='#blog';
 document.getElementById('nb').className=b?'on':'';document.getElementById('nh').className=b?'':'on';
 app.innerHTML=b?blog():home();
}
function shrink(file){return new Promise(function(res,rej){
 var im=new Image(),u=URL.createObjectURL(file);
 im.onload=function(){var s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;var x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error('Image failed'))},'image/jpeg',.92)};
 im.onerror=function(){rej(new Error('Could not read that image'))};im.src=u})}
function toData(b){return new Promise(function(r){var f=new FileReader();f.onload=function(){r(f.result)};f.readAsDataURL(b)})}
function build(){
 var c=document.cloneNode(true);
 c.getElementById('app').innerHTML='';
 c.getElementById('data').textContent=JSON.stringify(DATA).replace(/</g,'\\u003c');
 return '<!doctype html>\n'+c.documentElement.outerHTML}
async function save(){
 busy=true;
 try{await art.publish(build())}
 catch(e){busy=false;note=(e&&e.code==='not_writer'||e&&e.code==='not_granted')?'Only the owner can publish.':'Could not publish: '+((e&&e.message)||'try again');render()}
}
app.addEventListener('click',async function(e){
 var t=e.target;if(!owner||busy)return;
 if(t.id==='soc'){socEdit=!socEdit;render();return}
 if(t.id==='ss'){var s={},bad=false;['instagram','tiktok','pinterest'].forEach(function(k){var v=document.getElementById('s_'+k).value.trim();if(v&&!/^https?:\/\//i.test(v))bad=true;s[k]=v});if(bad){document.getElementById('sm').textContent='Links must start with https://';return}DATA.socials=s;socEdit=false;await save();return}
 if(t.id==='add'){editing=null;formOpen=true;note='';render()}
 else if(t.dataset.edit){editing=t.dataset.edit;formOpen=true;note='';render();location.hash='blog';window.scrollTo(0,0)}
 else if(t.dataset.del){if(pendDel!==t.dataset.del){pendDel=t.dataset.del;render();return}pendDel=null;DATA.products=DATA.products.filter(function(p){return p.id!==t.dataset.del});await save()}
 else if(t.id==='fs'){
  var title=document.getElementById('ft').value.trim(),link=document.getElementById('fl').value.trim(),m=document.getElementById('fm');
  var file=document.getElementById('fi').files[0],ex=editing?DATA.products.filter(function(x){return x.id===editing})[0]:null;
  if(!title||!/^https?:\/\//i.test(link)||(!file&&!ex)){m.textContent='Add an image, a title, and a link starting with https://';return}
  t.disabled=true;m.textContent='Publishing…';
  try{
   var img=ex?ex.img:'';
   if(file){var b=await shrink(file);img=await toData(b)}
   var rec={id:ex?ex.id:String(Date.now()),ts:ex?ex.ts:Date.now(),title:title,desc:document.getElementById('fd').value.trim(),price:document.getElementById('fp').value.trim(),link:link,img:img};
   DATA.products=DATA.products.filter(function(p){return p.id!==rec.id});DATA.products.push(rec);
   editing=null;formOpen=false;note='';await save();
  }catch(err){t.disabled=false;m.textContent=err.message||'Failed'}
 }
});
window.addEventListener('hashchange',function(){formOpen=false;editing=null;render();window.scrollTo(0,0)});
render();

})();
</script>
