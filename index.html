<style>
:root {
  --bg: #f7f5f3;
  --hero: #efeae4;
  --ink: #2b2b2e;
  --gold: #9a8468;
  --card: #fff;
  --line: #d9cfc2;
  --muted: #6b665f;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1c1b;
    --hero: #292725;
    --ink: #f1ece6;
    --gold: #c2ab8a;
    --card: #262422;
    --line: #4a443d;
    --muted: #aaa299;
  }
}

:root[data-theme="dark"] {
  --bg: #1d1c1b;
  --hero: #292725;
  --ink: #f1ece6;
  --gold: #c2ab8a;
  --card: #262422;
  --line: #4a443d;
  --muted: #aaa299;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  max-width: 100%;
  overflow-x: clip;
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 300 clamp(15px, 1.1vw, 17px)/1.65 Jost, system-ui, sans-serif;
  max-width: 100%;
  overflow-x: clip;
  overflow-wrap: break-word;
}

img {
  max-width: 100%;
  height: auto;
}

.serif {
  font-family: "Cormorant Garamond", Georgia, serif;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px 20px;
  flex-wrap: wrap;
  padding: 20px 5vw;
}

.brand {
  font: 400 clamp(18px, 1.6vw, 23px) "Cormorant Garamond", Georgia, serif;
  letter-spacing: .18em;
  text-decoration: none;
  color: var(--ink);
  white-space: nowrap;
}

nav {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 18px;
}

nav a {
  text-decoration: none;
  color: var(--ink);
  font-size: 14px;
  letter-spacing: .08em;
  white-space: nowrap;
}

nav a.on {
  border-bottom: 1px solid var(--gold);
}

.own {
  font-size: 11px;
  letter-spacing: .2em;
  color: var(--gold);
  white-space: nowrap;
}

.eyebrow {
  font-size: clamp(11px, .9vw, 12px);
  letter-spacing: clamp(.2em, .35vw, .35em);
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 500;
}

h1, h2 {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-weight: 400;
  margin: .15em 0;
  line-height: 1.06;
  overflow-wrap: break-word;
}

h1 {
  font-size: clamp(38px, 6.5vw, 84px);
}

h2 {
  font-size: clamp(30px, 4.2vw, 54px);
}

em {
  color: var(--gold);
}

.hero {
  margin: 0 5vw;
  background: var(--hero);
  border-radius: 32px;
  padding: clamp(32px, 5vw, 68px) clamp(20px, 4vw, 56px);
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr);
  gap: clamp(28px, 4vw, 48px);
  align-items: center;
}

.hero > div {
  min-width: 0;
}

.hero p {
  max-width: 48ch;
  margin: 12px 0 0;
}

.btn {
  display: inline-block;
  background: var(--ink);
  color: var(--bg);
  border: 0;
  border-radius: 999px;
  padding: 14px 28px;
  font: 500 14px/1.2 Jost, sans-serif;
  cursor: pointer;
  text-decoration: none;
  text-align: center;
}

.btn.ghost {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
}

.btn.sm {
  padding: 9px 16px;
  font-size: 13px;
}

.pills {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 20px;
}

.pill {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 999px;
  padding: 9px 16px;
  font-size: 13.5px;
  color: var(--ink);
  text-decoration: none;
  line-height: 1.3;
}

/* Showcase / Logo Card & Badges */
.logo-wrap {
  position: relative;
  padding: 20px 12px 24px;
  min-width: 0;
}

.logo {
  position: relative;
  background: var(--card);
  border-radius: 28px;
  min-height: clamp(220px, 26vw, 310px);
  padding: clamp(36px, 4vw, 56px) clamp(20px, 3vw, 32px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .08);
}

.logo b {
  font: 500 clamp(24px, 3vw, 44px)/1.1 "Cormorant Garamond", serif;
  letter-spacing: .04em;
  display: block;
  overflow-wrap: break-word;
}

.logo span {
  margin-top: 8px;
  font-size: clamp(10px, .9vw, 12px);
  letter-spacing: clamp(.18em, .3vw, .32em);
  color: var(--gold);
  display: block;
}

.tag {
  position: absolute;
  background: #2b2b2e;
  color: #f1ece6;
  border-radius: 16px;
  padding: 10px 16px;
  font-size: 12.5px;
  line-height: 1.25;
  box-shadow: 0 10px 24px rgba(0, 0, 0, .14);
  z-index: 2;
  max-width: calc(100% - 24px);
}

.tag b {
  display: block;
  font: 400 clamp(17px, 1.8vw, 22px)/1.1 "Cormorant Garamond", serif;
  color: #d9c9ad;
}

.t1 {
  top: 0;
  right: 0;
}

.t2 {
  bottom: 0;
  left: 0;
}

section {
  padding: clamp(48px, 6vw, 72px) 5vw;
}

.head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 32px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr));
  gap: 24px;
}

.card {
  background: var(--card);
  border-radius: 22px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  min-width: 0;
}

.card img {
  width: 100%;
  aspect-ratio: 4/5;
  object-fit: cover;
  background: var(--hero);
  display: block;
}

.card .b {
  padding: 18px 20px 22px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
  min-width: 0;
}

.card h3 {
  margin: 0;
  font: 500 clamp(20px, 1.8vw, 24px)/1.2 "Cormorant Garamond", serif;
  overflow-wrap: break-word;
}

.card p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  flex: 1;
}

.price {
  color: var(--gold);
  font-weight: 500;
}

.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.form {
  max-width: 640px;
  background: var(--card);
  border: 1px dashed var(--line);
  border-radius: 26px;
  padding: clamp(18px, 3vw, 26px);
  margin-bottom: 40px;
  display: grid;
  gap: 12px;
}

.form input,
.form textarea {
  width: 100%;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 13px 16px;
  font: 300 15px Jost, sans-serif;
}

.two {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.msg {
  font-size: 14px;
  color: var(--gold);
}

.empty {
  color: var(--muted);
  padding: 30px 0;
}

/* Tablet View */
@media (max-width: 1024px) {
  .hero {
    grid-template-columns: minmax(0, 1fr) minmax(0, .9fr);
    gap: 28px;
    padding: 40px 28px;
  }
}

/* Mobile & Small Tablet View */
@media (max-width: 800px) {
  .hero {
    grid-template-columns: 1fr;
    padding: 28px 18px 34px;
    border-radius: 24px;
    gap: 24px;
  }

  .two {
    grid-template-columns: 1fr;
  }

  header {
    padding: 14px 5vw;
  }

  .logo-wrap {
    padding: 14px 4px 18px;
  }

  .logo {
    min-height: 190px;
    padding: 36px 16px;
    border-radius: 22px;
  }

  .tag {
    padding: 8px 14px;
    border-radius: 14px;
  }
}

/* Small Phones */
@media (max-width: 480px) {
  h1 {
    font-size: clamp(34px, 11vw, 48px);
  }

  .btn {
    width: 100%;
    padding: 13px 22px;
  }

  .pills {
    gap: 8px;
  }

  .pill {
    padding: 8px 14px;
    font-size: 13px;
  }
}
</style>
